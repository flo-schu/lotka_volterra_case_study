[data-structure]
indices = rabbit_species experiment
rabbits = dimensions=['id','time'] min=0.0 max=1159.0 observed=True dimensions_evaluator=['id','time']
wolves = dimensions=['id','time'] min=0.0 max=858.0 observed=True dimensions_evaluator=['id','time']

[solverbase]
x_dim = time
exclude_kwargs_model = t time x_in y x Y X
exclude_kwargs_postprocessing = t time interpolation results

[jax-solver]
diffrax_solver = Dopri5
rtol = 1e-06
atol = 1e-07
pcoeff = 0.0
icoeff = 1.0
dcoeff = 0.0
max_steps = 100000
throw_exception = True

[inference]
eps = 1e-08
objective_function = total_average
n_objectives = 1
objective_names = 
extra_vars = 
n_predictions = 100

[model-parameters]
alpha_species = value=[[0.95,1.07,1.11],[3.01,2.99,2.96]] dims=['rabbit_species','experiment'] prior=norm(loc=[[1],[3]],scale=0.1) hyper=True free=True
